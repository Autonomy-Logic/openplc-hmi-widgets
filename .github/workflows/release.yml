name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and test the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || {
            echo "::error::origin/main was not fetched"; exit 1
          }
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to $(git rev-parse HEAD), which is not on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Check the tag against package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Install dependencies and the pinned STruC++
        run: npm ci && npm run setup:strucpp

      - name: Fetch the HMI core
        run: npm run setup:hmi-core

      - name: Build twice and compare
        run: |
          npm run build -- --out dist-a
          npm run build
          diff -r dist-a dist

      - name: Unit tests
        run: npm test

      - name: Native tests
        run: npm run test:native

      - name: Verify the sums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Upload the release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Verify the sums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "${GITHUB_REF_NAME}" =~ (alpha|beta|rc) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE} \
            dist/*
